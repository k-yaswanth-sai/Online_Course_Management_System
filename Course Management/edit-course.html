<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course | Course Management System</title>

    <link rel="stylesheet" href="css/edit-course.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>

        <div class="logo">
            <h2>📚 CourseHub</h2>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="courses.html">Courses</a>
            <a href="add-course.html">Add Course</a>
            <a href="edit-course.html" class="active">Edit Course</a>
            <a href="index.html">Logout</a>
        </nav>

    </header>

    <!-- Main Container -->
    <section class="container">

        <div class="form-box">

            <h1>Edit Course</h1>
            <p>Update or delete course details.</p>

            <form id="editCourseForm">

                <div class="input-group">
                    <label>Course ID</label>
                    <input
                        type="text"
                        id="courseId"
                        readonly>
                </div>

                <div class="input-group">
                    <label>Course Name</label>
                    <input
                        type="text"
                        id="courseName"
                        required>
                </div>

                <div class="input-group">
                    <label>Instructor Name</label>
                    <input
                        type="text"
                        id="instructor"
                        required>
                </div>

                <div class="input-group">
                    <label>Category</label>

                    <select id="category" required>
                        <option>Programming</option>
                        <option>Web Development</option>
                        <option>Database</option>
                        <option>Cloud Computing</option>
                        <option>Cyber Security</option>
                        <option>Artificial Intelligence</option>
                    </select>

                </div>

                <div class="input-group">
                    <label>Duration</label>
                    <input
                        type="text"
                        id="duration"
                        required>
                </div>

                <div class="input-group">
                    <label>Course Fee (₹)</label>
                    <input
                        type="number"
                        id="fee"
                        required>
                </div>

                <div class="input-group">
                    <label>Course Image URL</label>
                    <input
                        type="text"
                        id="image">
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea
                        id="description"
                        rows="5"
                        required></textarea>
                </div>

                <div class="buttons">

                    <button type="submit" class="update-btn">
                        <i class="fa-solid fa-pen"></i>
                        Update Course
                    </button>

                    <button type="button" class="delete-btn" id="deleteCourse">
                        <i class="fa-solid fa-trash"></i>
                        Delete Course
                    </button>

                </div>

            </form>

        </div>

    </section>

    <script src="js/edit-course.js"></script>

</body>
</html>
