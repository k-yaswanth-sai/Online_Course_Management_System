<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | Course Management System</title>
    <link rel="stylesheet" href="css/add-course.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <h2>📚 CourseHub</h2>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="courses.html">Courses</a>
            <a href="add-course.html" class="active">Add Course</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>

    <!-- Add Course Form -->
    <section class="container">

        <div class="form-box">

            <h1>Add New Course</h1>
            <p>Fill in the course details below.</p>

            <form id="courseForm">

                <div class="input-group">
                    <label>Course ID</label>
                    <input
                        type="text"
                        id="courseId"
                        placeholder="Enter Course ID"
                        required>
                </div>

                <div class="input-group">
                    <label>Course Name</label>
                    <input
                        type="text"
                        id="courseName"
                        placeholder="Enter Course Name"
                        required>
                </div>

                <div class="input-group">
                    <label>Instructor Name</label>
                    <input
                        type="text"
                        id="instructor"
                        placeholder="Enter Instructor Name"
                        required>
                </div>

                <div class="input-group">
                    <label>Category</label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Programming</option>
                        <option>Web Development</option>
                        <option>Database</option>
                        <option>Cloud Computing</option>
                        <option>Cyber Security</option>
                        <option>Artificial Intelligence</option>
                    </select>

                </div>

                <div class="input-group">
                    <label>Duration</label>
                    <input
                        type="text"
                        id="duration"
                        placeholder="Example: 8 Weeks"
                        required>
                </div>

                <div class="input-group">
                    <label>Course Fee (₹)</label>
                    <input
                        type="number"
                        id="fee"
                        placeholder="Enter Course Fee"
                        required>
                </div>

                <div class="input-group">
                    <label>Course Image URL</label>
                    <input
                        type="text"
                        id="image"
                        placeholder="images/java.jpg">
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Enter Course Description"
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-plus"></i>
                    Add Course
                </button>

            </form>

        </div>

    </section>

    <script src="js/add-course.js"></script>

</body>
</html>
